[project]
name = "housegallery-cms"
version = "0.1.0"
description = "FastAPI headless CMS for This is a House Gallery"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sqladmin>=0.20",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "boto3>=1.43.66",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
